name: Tag — Release Candidate

on:
  push:
    branches:
      - release-candidate

permissions:
  contents: write

jobs:
  tag-rc:
    name: Compute & push RC tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version and RC tag
        id: rc_tag
        run: |
          # ── 1. Find the last GA release tag (vX.Y.Z, no pre-release suffix) ──
          LAST_TAG=$(git tag --list "v*.*.*" \
            | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" \
            | sort -V \
            | tail -1)

          if [ -z "$LAST_TAG" ]; then
            # No GA release yet — start from the manifest version
            LAST_TAG="v$(jq -r '.["."]' .github/.release-please-manifest.json)"
            echo "No GA tag found, using manifest version as base: $LAST_TAG"
          else
            echo "Last GA tag: $LAST_TAG"
          fi

          # ── 2. Analyse commits since the last GA tag ───────────────────────
          COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")

          BREAKING=false
          FEAT=false
          FIX=false

          while IFS= read -r msg; do
            # Breaking change: footer "BREAKING CHANGE:" or "!" after type
            if echo "$msg" | grep -qE "^[a-z]+(\(.+\))?!:|BREAKING CHANGE:"; then
              BREAKING=true
            elif echo "$msg" | grep -qE "^feat(\(.+\))?:"; then
              FEAT=true
            elif echo "$msg" | grep -qE "^fix(\(.+\))?:"; then
              FIX=true
            fi
          done <<< "$COMMITS"

          # ── 3. Determine the bump ──────────────────────────────────────────
          MAJOR=$(echo "$LAST_TAG" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "$LAST_TAG" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "$LAST_TAG" | sed 's/v//' | cut -d. -f3)

          if [ "$BREAKING" = true ]; then
            MAJOR=$(( MAJOR + 1 ))
            MINOR=0
            PATCH=0
            BUMP="major"
          elif [ "$FEAT" = true ]; then
            MINOR=$(( MINOR + 1 ))
            PATCH=0
            BUMP="minor"
          elif [ "$FIX" = true ]; then
            PATCH=$(( PATCH + 1 ))
            BUMP="patch"
          else
            # Only chore/docs/refactor/etc — no version bump warranted.
            # Reuse the last GA version (e.g. infrastructure-only changes).
            BUMP="none"
          fi

          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bump type: $BUMP → next version: v${NEXT_VERSION}"

          # ── 4. Compute the next RC index for this version ──────────────────
          LAST_RC=$(git tag --list "v${NEXT_VERSION}-rc.*" \
            | sed "s/v${NEXT_VERSION}-rc\.//" \
            | sort -n \
            | tail -1)

          if [ -z "$LAST_RC" ]; then
            NEXT_RC=0
          else
            NEXT_RC=$(( LAST_RC + 1 ))
          fi

          TAG="v${NEXT_VERSION}-rc.${NEXT_RC}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Computed RC tag: $TAG"

      - name: Push RC tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.rc_tag.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rc_tag.outputs.tag }}
          name: "Release Candidate ${{ steps.rc_tag.outputs.tag }}"
          body: "⚠️ Pre-release candidate — not intended for production use."
          prerelease: true