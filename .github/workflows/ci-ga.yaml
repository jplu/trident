name: CI — GA Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate GA tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Ensure tag is a clean semver GA (no pre-release suffix)
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" =~ -[a-zA-Z] ]]; then
            echo "❌ '$TAG' looks like a pre-release tag. Skipping GA workflow."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ '$TAG' is not a valid semver GA tag."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build & test
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.25.x', '1.26.x' ]
        os: [ ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Run linter
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          args: --timeout=3m ./...

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x'
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: true
          verbose: true

      - name: Build all packages
        run: go build -v ./...

  publish:
    name: Publish release artifacts
    needs: [validate, build]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate source archive & checksums
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="source/" -o "dist/source-${TAG}.tar.gz" HEAD
          cd dist && sha256sum * > checksums.txt
          cat checksums.txt

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: |
            dist/source-${{ needs.validate.outputs.tag }}.tar.gz
            dist/checksums.txt