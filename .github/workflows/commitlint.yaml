name: Conventional Commitlint

on:
  push:
    branches:
      - main
      - release-candidate
      - develop
  pull_request:
    branches:
      - main
      - release-candidate
      - develop

jobs:
  commitlint:
    runs-on: ubuntu-latest
    name: Conventional Commitlint
    steps:
      - name: Conventional Commitlint
        uses: opensource-nepal/commitlint@v1