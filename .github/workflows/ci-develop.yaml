name: CI — Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.25.x', '1.26.x' ]
        os: [ ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Install gotestsum
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x'
        run: go install gotest.tools/gotestsum@latest

      - name: Run linter
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          args: --timeout=3m ./...

      - name: Run tests with coverage
        if: "!(matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x')"
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run tests with coverage and JUnit output
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x'
        run: |
          gotestsum --junitfile junit.xml -- \
            -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-develop-${{ github.sha }}
          path: coverage.txt
          retention-days: 7

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x'
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x' }}
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./junit.xml
          report-type: test_results
          fail_ci_if_error: true

      - name: Build all packages
        run: go build -v ./...