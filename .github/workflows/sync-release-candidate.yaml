name: Sync — main into release-candidate

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Open sync PR and auto-merge into release-candidate
    runs-on: ubuntu-latest

    if: github.actor != 'github-actions[bot]' && !startsWith(github.ref_name, 'sync/')

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Create sync branch from main
        id: branch
        run: |
          BRANCH="sync/main-into-release-candidate-${{ github.run_id }}"
          git checkout -b "$BRANCH" origin/main
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open PR targeting release-candidate
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: 'chore: sync main into release-candidate',
              body:  'Automated sync of `main` into `release-candidate`.',
              head:  '${{ steps.branch.outputs.branch }}',
              base:  'release-candidate',
            });
            console.log(`PR #${pr.data.number} created: ${pr.data.html_url}`);
            core.setOutput('number', pr.data.number);
            core.setOutput('sha', pr.data.head.sha);

      - name: Wait for all checks to complete
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            const owner       = context.repo.owner;
            const repo        = context.repo.repo;
            const sha         = '${{ steps.pr.outputs.sha }}';
            const maxWait     = 30;
            const interval    = 30;
            const syncJobName = 'Open sync PR and auto-merge into release-candidate';

            const protection = await github.rest.repos.getBranchProtection({
              owner, repo, branch: 'release-candidate',
            });
            const requiredChecks = protection.data.required_status_checks.contexts;
            console.log('Required checks:', requiredChecks);

            for (let i = 0; i < maxWait; i++) {
              const { data: result } = await github.rest.checks.listForRef({
                owner, repo, ref: sha,
              });

              const runs            = result.check_runs.filter(r => r.name !== syncJobName);
              const required        = runs.filter(r => requiredChecks.includes(r.name));
              const others          = runs.filter(r => !requiredChecks.includes(r.name));
              const requiredPending = required.filter(r => r.status !== 'completed');
              const requiredFailed  = required.filter(r => r.status === 'completed' && r.conclusion !== 'success');
              const othersPending   = others.filter(r => r.status !== 'completed');

              console.log(
                `[${i + 1}/${maxWait}]`,
                `Required → pending: ${requiredPending.length}, failed: ${requiredFailed.length} |`,
                `Others → pending: ${othersPending.length}`
              );

              if (requiredFailed.length > 0) {
                core.setFailed(`Required checks failed: ${requiredFailed.map(r => r.name).join(', ')}`);
                return;
              }

              if (requiredPending.length === 0 && required.length === requiredChecks.length && othersPending.length === 0) {
                console.log('All required checks passed and all other checks completed. Ready to merge.');
                return;
              }

              await new Promise(r => setTimeout(r, interval * 1000));
            }

            core.setFailed(`Checks did not complete within ${maxWait * interval / 60} minutes.`);

      - name: Squash and merge the PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            await github.rest.pulls.merge({
              owner:          context.repo.owner,
              repo:           context.repo.repo,
              pull_number:    ${{ steps.pr.outputs.number }},
              merge_method:   'squash',
              commit_title:   'chore: sync main into release-candidate',
              commit_message: 'Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>',
            });
            console.log('PR squash-merged successfully.');

      - name: Delete sync branch
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                ref:   'heads/${{ steps.branch.outputs.branch }}',
              });
              console.log('Sync branch deleted.');
            } catch (e) {
              console.log('Branch already deleted or not found:', e.message);
            }