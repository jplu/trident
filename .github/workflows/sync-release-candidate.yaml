name: Sync — main into release-candidate

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Open sync PR and rebase into release-candidate
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Check if push is an automated sync
        id: guard
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            const automatedTitles = ['chore: sync main into rc', 'chore: sync rc into develop'];
            const isAutomated = pulls.some(pr => automatedTitles.includes(pr.title));
            
            if (isAutomated) {
              console.log("Push originated from an automated sync PR. Skipping.");
              core.setOutput('skip', 'true');
            } else {
              core.setOutput('skip', 'false');
            }

      - name: Check for changes
        if: steps.guard.outputs.skip == 'false'
        id: diff
        run: |
          git fetch origin release-candidate
          # Count commits in main that are not in release-candidate
          CHANGES=$(git rev-list --count origin/release-candidate..origin/main)
          if [ "$CHANGES" -eq "0" ]; then
            echo "No changes to sync."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch
        if: steps.guard.outputs.skip == 'false' && steps.diff.outputs.has_changes == 'true'
        id: branch
        run: |
          BRANCH="sync/main-into-rc-${{ github.run_id }}"
          git checkout -b "$BRANCH" origin/main
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.guard.outputs.skip == 'false' && steps.diff.outputs.has_changes == 'true'
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: 'chore: sync main into rc',
              body:  'Automated sync of `main` into `release-candidate`.',
              head:  '${{ steps.branch.outputs.branch }}',
              base:  'release-candidate',
            });
            core.setOutput('number', pr.data.number);

      - name: Wait for Mergeability
        if: steps.guard.outputs.skip == 'false' && steps.diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            for (let i = 0; i < 10; i++) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              console.log(`State: ${pr.mergeable_state}`);
              // 'clean' means ready, 'blocked' usually means waiting for checks (but we can try to rebase anyway)
              if (pr.mergeable_state === 'clean' || pr.mergeable_state === 'blocked') return;
              if (pr.mergeable_state === 'dirty') core.setFailed('Merge conflict detected');
              await new Promise(r => setTimeout(r, 10000));
            }

      - name: Rebase and Merge
        if: steps.guard.outputs.skip == 'false' && steps.diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.pr.outputs.number }},
              merge_method: 'rebase',
            });

      - name: Cleanup Branch
        if: steps.branch.outputs.branch != '' && always()
        run: git push origin --delete ${{ steps.branch.outputs.branch }}