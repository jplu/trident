name: Sync — release-candidate into develop

on:
  push:
    branches:
      - release-candidate

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Open sync PR and rebase into develop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Check if push is an automated sync
        id: guard
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const isAutomated = pulls.some(pr => pr.title === 'chore: sync rc into develop');
            core.setOutput('skip', isAutomated ? 'true' : 'false');

      - name: Create sync branch from release-candidate
        if: steps.guard.outputs.skip == 'false'
        id: branch
        run: |
          BRANCH="sync/rc-into-develop-${{ github.run_id }}"
          git checkout -b "$BRANCH" origin/release-candidate
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open PR targeting develop
        if: steps.guard.outputs.skip == 'false'
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: 'chore: sync rc into develop',
              body:  'Automated sync of `release-candidate` into `develop`.',
              head:  '${{ steps.branch.outputs.branch }}',
              base:  'develop',
            });
            core.setOutput('number', pr.data.number);

      - name: Wait for required status checks
        if: steps.guard.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const maxWait = 30;
            for (let i = 0; i < maxWait; i++) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
              });
              if (pr.mergeable_state === 'clean') return;
              if (pr.mergeable_state === 'dirty') core.setFailed('Merge conflicts detected.');
              await new Promise(r => setTimeout(r, 30000));
            }
            core.setFailed('Checks timed out.');

      - name: Rebase the PR
        if: steps.guard.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            await github.rest.pulls.merge({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              pull_number:  ${{ secrets.pr.outputs.number || steps.pr.outputs.number }},
              merge_method: 'rebase', // Changed from 'merge' to 'rebase'
            });

      - name: Delete sync branch
        if: steps.guard.outputs.skip == 'false' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PAT }}
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                ref:   'heads/${{ steps.branch.outputs.branch }}',
              });
            } catch (e) {}